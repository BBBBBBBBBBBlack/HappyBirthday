<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday - Luxury 3D Experience</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #050505; /* Deep black for contrast */
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        color: #e2e2e2;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #000;
        z-index: 10;
        pointer-events: none;
        transition: opacity 1s ease;
      }
      .loading-text {
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        color: #d4af37; /* Metallic Gold */
        text-transform: uppercase;
        margin-top: 20px;
      }
      .cam-preview {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 160px;
        height: 120px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #d4af37;
        opacity: 0.7;
        z-index: 5;
        transform: scaleX(-1); /* Mirror effect */
      }
      .cam-preview video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .instructions {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 5;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }
      .instructions h2 {
        font-weight: 300;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.8);
        margin: 0;
        letter-spacing: 2px;
      }
      .instructions span {
        color: #d4af37;
        font-weight: 600;
      }
    </style>
  <script type="importmap">
{

  }
}
